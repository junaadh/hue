[workspace]
members = ["crates/*"]
resolver   = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-stm32 = { version = "0.6.0", features = ["stm32f411ce", "time-driver-any", "memory-x"] }
embassy-time = { version = "0.5.1", features = ["tick-hz-32_768"] }
embedded-graphics = "0.8.2"
embedded-hal-bus = "0.3.0"
mipidsi = "0.10.0"
panic-halt = "1.0.0"
static_cell = "2.1.1"
embassy-usb = "0.6.0"
